# Permissions this plugin needs. Each one names a gated maki API it calls.
#
# For a plugin you installed yourself, maki reads the grants from the
# plugin.toml of the config dir that loads it, so these keys belong in
# ~/.config/maki/plugin.toml (or <project>/.maki/plugin.toml for a project
# install). Merging is enough: adding this block to a file you already have
# keeps your other grants.
#
# With no manifest at all every gated call is denied. An existing manifest
# grants every key it does not set to false, so the list below also documents
# what this plugin touches.

[permissions]
# listen_unix, and the chmod helper that keeps the socket owner-only.
run = true
# state dir lookups, /proc/self/stat for the pid, maki.uv.cwd for hello.
fs_read = true
# mkdir -p and the removal of a stale socket file before bind.
fs_write = true
# MAKI_GATEWAY_SOCK and XDG_STATE_HOME.
env = true
# maki.session.prompt, and maki.session.new with a prompt.
agent = true
# maki.session.messages, maki.plan.read, and the content fields of events.
session_read = true
# maki.session.new, notify, and the pop_queue action.
session_write = true
# maki.session.set_mode and maki.session.set_title.
session_settings = true
